name: Globorama
options:
  bundleIdPrefix: com.mariusarnesen
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release
  groupSortPosition: top

schemes:
  Globorama:
    build:
      targets:
        Globorama: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GloboramaTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Globorama:
    type: application
    platform: iOS
    sources:
      - path: Globorama
        excludes:
          - "**/*.xcassets/**/Contents.json"
    resources:
      - path: Globorama/Assets.xcassets
      - path: Globorama/Resources
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
        INFOPLIST_KEY_UILaunchScreen_ImageName: ""
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Globorama
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mariusarnesen.globorama
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  GloboramaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GloboramaTests
    dependencies:
      - target: Globorama
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mariusarnesen.globorama.tests
